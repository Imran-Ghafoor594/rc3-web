services:
  - type: web
    name: rc3-task4-hook
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn webhook:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: review-inbox
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: REVIEW_DB
        value: /var/data/reviews.sqlite
      - key: RESULTS_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
  - type: web
    name: rc3-task4-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: RESULTS_KEY
        fromService:
          type: web
          name: rc3-task4-hook
          envVarKey: RESULTS_KEY
